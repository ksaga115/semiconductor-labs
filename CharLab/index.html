<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特性ラボ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div id="brand">特性ラボ</div>
    <div class="group">
      <span class="note">謎の素子6つ（ダイオード・MOSFET・MOS容量・温度を振ったダイオード・段のある接合・2成分のダイオード）を測定表から読み解き、n・Vth・tox・Eg・濃度の分布などを当てる。参考書は <a href="../第2部_デバイスの基礎.html">第2部 デバイスの基礎</a></span>
    </div>
  </header>

  <main>
    <aside id="left">
      <section id="designBox">
        <h2>答案 ― あなたの読み</h2>
        <div id="designForm"></div>
        <h2>測定表（ここに嘘はない）</h2>
        <div id="derived"></div>
      </section>
    </aside>

    <div id="stage">
      <canvas id="board"></canvas>
      <div id="status"><span id="statLeft"></span><span id="statRight"></span></div>
    </div>

    <aside id="quests">
      <h2>課題</h2>
      <div id="questBody" class="hidden">
        <h3 id="qName"></h3>
        <p id="qDesc"></p>
        <p id="qWhy" class="why-line"></p>
        <details id="qHintWrap"><summary>ヒント</summary><p id="qHint"></p></details>
        <button id="btnGrade" class="tb primary wide">採点する</button>
        <button id="btnAnswer" class="tb wide">お手本を見る</button>
        <div id="qResult"></div>
      </div>
      <div id="questList"></div>
    </aside>
  </main>
</div>

<script src="src/char.js"></script>
<script src="src/quest.js"></script>
<script src="src/answer.js"></script>
<script src="src/store.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
