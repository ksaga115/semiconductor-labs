<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アナログラボ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div id="brand">アナログラボ</div>
    <div class="group">
      <span class="note">W/L と電流で Vov・gm・利得・帯域・雑音を決めて、採点にかける（二乗則）。参考書は <a href="../第6部_アナログ回路.html">第6部 アナログ回路</a></span>
    </div>
  </header>

  <main>
    <aside id="left">
      <section id="designBox">
        <h2>回路を設計する</h2>
        <div id="designForm"></div>
        <h2>設計から出る数字</h2>
        <div id="derived"></div>
      </section>
    </aside>

    <div id="stage">
      <canvas id="board"></canvas>
      <div id="status"><span id="statLeft"></span><span id="statRight"></span></div>
    </div>

    <aside id="quests">
      <h2>課題</h2>
      <div id="questBody" class="hidden">
        <h3 id="qName"></h3>
        <p id="qDesc"></p>
        <p id="qWhy" class="why-line"></p>
        <details id="qHintWrap"><summary>ヒント</summary><p id="qHint"></p></details>
        <button id="btnGrade" class="tb primary wide">採点する</button>
        <button id="btnAnswer" class="tb wide">お手本を見る</button>
        <div id="qResult"></div>
      </div>
      <div id="questList"></div>
    </aside>
  </main>
</div>

<script src="src/analog.js"></script>
<script src="src/quest.js"></script>
<script src="src/answer.js"></script>
<script src="src/store.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
